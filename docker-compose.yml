services:
  postgres:
    image: postgres:16
    container_name: it-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: it_inventory
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d it_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
